[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:django]
; 默认单 worker（UVICORN_WORKERS=1）。横向扩展前必须满足：
;   1) AGENT_STOP_BACKEND=redis（否则停止按钮只有 1/N 概率生效）
;   2) CHANNEL_LAYER_BACKEND=redis（使用 WebSocket 时必需）
;   3) 各 worker 的 AGENT_CHECKPOINTER_POOL_SIZE 之和 <= PG max_connections * 0.6
command=sh -c "exec uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} --timeout-keep-alive 75"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/django_err.log
stdout_logfile=/var/log/django_out.log

[program:celery_worker]
command=celery -A wharttest_django worker -l info --concurrency=4 -Q celery,task_center
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/worker_err.log
stdout_logfile=/var/log/worker_out.log

[program:celery_beat]
command=celery -A wharttest_django beat -l info --schedule=/app/data/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/beat_err.log
stdout_logfile=/var/log/beat_out.log
